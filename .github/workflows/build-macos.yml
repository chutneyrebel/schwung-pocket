name: Build Schwung Pocket for macOS

on:
  workflow_dispatch:
  push:
    branches: [main, macos-app]
    paths:
      - "macOS/**"
      - ".github/workflows/build-macos.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Swift
        run: swift --version

      - name: Build release executable
        working-directory: macOS
        run: swift build -c release

      - name: Assemble app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="Schwung Pocket.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "macOS/.build/release/SchwungPocketMac" "$APP/Contents/MacOS/SchwungPocketMac"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Schwung Pocket</string>
            <key>CFBundleDisplayName</key><string>Schwung Pocket</string>
            <key>CFBundleIdentifier</key><string>com.chutneyrebel.schwungpocket.mac</string>
            <key>CFBundleExecutable</key><string>SchwungPocketMac</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSLocalNetworkUsageDescription</key><string>Connect to Ableton Move on your local network.</string>
            <key>NSAppTransportSecurity</key>
            <dict><key>NSAllowsLocalNetworking</key><true/></dict>
          </dict>
          </plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${GITHUB_RUN_NUMBER}" "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Schwung-Pocket-macOS.zip"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: schwung-pocket-macos-${{ github.run_number }}
          path: Schwung-Pocket-macOS.zip
          if-no-files-found: error
          retention-days: 14
